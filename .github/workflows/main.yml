name: Build Windows Kernel Exploit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Visual Studio environment
      uses: microsoft/setup-msbuild@v2

    # 使用 winget 安装 WDK (替换之前出错的步骤)
    - name: Install WDK using winget
      shell: powershell
      run: |
        winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --silent --accept-package-agreements --accept-source-agreements

    - name: Build CVE-2024-35250
      run: |
        msbuild CVE-2024-35250/CVE-2024-35250.vcxproj /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

    - name: Build CVE-2026-62735
      run: |
        msbuild CVE-2026-62735/CVE-2026-62735.vcxproj /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: exploits
        path: |
          CVE-2024-35250/Release/**/*.exe
          CVE-2024-35250/Release/**/*.dll
          CVE-2024-35250/Release/**/*.sys
          CVE-2026-62735/Release/**/*.exe
          CVE-2026-62735/Release/**/*.dll
          CVE-2026-62735/Release/**/*.sys
        if-no-files-found: warn
